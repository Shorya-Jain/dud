# Cloudflare Worker for the dud registry. See docs/DEPLOY.md.
name = "dud-registry"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "dud-registry"
database_id = "972187d0-55a6-4b50-bb44-f76c018f8bcf"
migrations_dir = "migrations"

# Optional: keep a copy of each submitted document in a private R2 bucket.
# Without it, the registry keeps only readings and raw hashes (no storage costs).
# [[r2_buckets]]
# binding = "RAW"
# bucket_name = "dud-raw"

[vars]
GITHUB_CLIENT_ID = "REPLACE_WITH_YOUR_GITHUB_CLIENT_ID"  # docs/DEPLOY.md, step 2
# Settings. Defaults are in src/env.ts. Values here override them.
ACCESS_DAYS = "30"
DAILY_LOOKUP_QUOTA = "100"
CHALLENGE_TTL_HOURS = "3"
CARD_UNLOCK_DAYS = "30"
NEW_GITHUB_ACCOUNT_DAYS = "30"
CONTRIBUTOR_CAP = "0.1"
# dud 0.2.0 and later send a load test. Results without one give no access.
REQUIRE_LOAD = "true"

# Secrets (do not put them in this file). Set them with:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put CARD_ID_PEPPER
#   npx wrangler secret put ADMIN_TOKEN
