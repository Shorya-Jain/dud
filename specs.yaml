  A100-PCIE-40GB:
    name: NVIDIA A100 PCIe 40GB
    memory_mib: {min: 40000, max: 40960, source: *smi, verify: true}
    power_default_w: {min: 245, max: 250, source: *a100}
    fp16_dense_tflops: {value: 312.0, source: *a100}
    bf16_dense_tflops: {value: 312.0, source: *a100}
    hbm_gbps: {value: 1555, source: *a100}

  A100-PCIE-80GB:
    name: NVIDIA A100 80GB PCIe
    memory_mib: {min: 80000, max: 81920, source: *smi, verify: true}
