  A100-SXM4-80GB:
    name: NVIDIA A100 SXM4 80GB
    memory_mib: {min: 80000, max: 81920, source: *smi, verify: true}
    # Some HGX A100 80GB boards ship with a 500 W default.
    power_default_w: {min: 390, max: 500, source: *a100, verify: true}
    fp16_dense_tflops: {value: 312.0, source: *a100}
    bf16_dense_tflops: {value: 312.0, source: *a100}
